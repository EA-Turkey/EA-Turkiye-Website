devrim:
  name: Ceren Devrim Karabulut
  initials: C
  photo: team/ceren-devrim-karabulut.jpg
  role:
    tr: Eş Direktör
    en: Co-Director
  bio:
    tr: Orta Doğu Teknik Üniversitesi Sosyoloji bölümü mezunu olan Ceren Devrim Karabulut, Efektif Altruizm Türkiye'nin eş direktörü olarak Türkiye'deki efektif altruizm hareketinin gelişimine katkı sağlamaktadır. Uzmanlık alanları müşteri deneyimi tasarımı ve topluluk organizasyonudur. Ceren aynı zamanda yüksek etkili sağlık politikası derneklerine işe alım desteği sağlayan ve erken ile orta kariyer profesyoneller için eğitim programları düzenleyen Health Progress Hub isimli bir sivil toplum kuruluşunda topluluk ve iletişim sorumlusu olarak görev yapmaktadır. Daha öncesinde, Birleşmiş Milletler Kalkınma Programı'ndaki görevi kapsamında iletişim ekibinin bir parçası olarak Sürdürülebilir Kalkınma Amaçları'nın sosyal medya hesaplarını yönetmiştir.
    en: Ceren Devrim Karabulut, a graduate of the Sociology Department at Middle East Technical University, contributes to the development of the effective altruism movement in Turkey as the co-director of Effective Altruism Turkey. Her areas of expertise are customer experience design and community organizing. Ceren also serves as the community and communications manager at a non-governmental organization called Health Progress Hub, which provides recruitment support to high-impact health policy associations and organizes training programs for early- to mid-career professionals. Previously, as part of the communications team during her tenure at the United Nations Development Programme, she managed the social media accounts for the Sustainable Development Goals.
  bio_short:
    tr: ODTÜ Sosyoloji mezunu Ceren, müşteri deneyimi tasarımı ve topluluk organizasyonu alanlarında uzmandır. Health Progress Hub'da topluluk ve iletişim sorumlusu olarak çalışmakta olup daha önce Birleşmiş Milletler Kalkınma Programı'nın iletişim ekibinde görev yapmıştır.
    en: A sociology graduate of METU, Ceren specializes in customer experience design and community organizing. She is the community and communications manager at Health Progress Hub and previously served on the United Nations Development Programme's communications team.
  email: ""
  linkedin: ""

firat:
  name: Fırat Akova
  initials: F
  photo: team/firat-akova.jpg
  role:
    tr: Eş Direktör
    en: Co-Director
  bio:
    tr: Dr. Fırat Akova, küresel demokrasinin gelişimine katkı sunan demokrasi kuruluşları arasından en yüksek etkiyi yaratanları saptamaya yönelik çalışmalar yürüten Power for Democracies'te kıdemli araştırmacı olarak yer aldı. Akova, Koç Üniversitesi Felsefe Bölümü'nde öğretim görevlisi olarak çalıştı. Doktorasını Warwick Üniversitesi Felsefe Bölümü'nde efektif altruizm üzerine yazdığı tezle tamamladı ve aynı bölümde araştırma görevlisi olarak dersler verdi. Poedat'ın ve Efektif Altruizm Türkiye'nin kurucusudur.
    en: Dr. Fırat Akova was a Senior Research Fellow at Power for Democracies, which works to identify the highest-impact organizations among those contributing to the advancement of global democracy. Akova worked as a Lecturer in the Department of Philosophy at Koç University. He completed his PhD in the Department of Philosophy at the University of Warwick with a thesis on effective altruism, and taught in the same department as a research assistant. He is the founder of Poedat and Effective Altruism Türkiye.
  bio_short:
    tr: Dr. Fırat Akova, Centre for Governance of AI'da dönemsel araştırmacı sıfatıyla yapay zekâ kaynaklı güç yoğunlaşmasının yol açabileceği riskler üzerine çalıştı. Future Impact Group'ta New York Üniversitesi'nden bir ekiple birlikte yapay hissedebilirlik, yapay bilinç ve dijital zihinler üzerine araştırma yürüttü. Oxford Üniversitesi'ne bağlı Global Priorities Institute ve onunla yakından çalışan Forethought Foundation for Global Priorities Research altında açılan bir araştırma programı kapsamında bizden yüzyıllar sonra doğacak gelecek kuşakların şu anki politik kurumlarda nasıl temsil edilebileceği üzerine ve ayrıca yapay hissedebilir varlıkların ortaya çıkmasının doğurabileceği etik, politik ve hukuki konular üzerine araştırma yaptı.
    en: Dr. Fırat Akova worked as a visiting researcher at the Centre for Governance of AI on the risks that AI-driven concentration of power may pose. At Future Impact Group, he conducted research on artificial sentience, artificial consciousness, and digital minds together with a team from New York University. Within a research programme under the Global Priorities Institute at the University of Oxford and the closely affiliated Forethought Foundation for Global Priorities Research, he researched how future generations to be born centuries from now could be represented in today's political institutions, as well as the ethical, political, and legal issues that the emergence of artificially sentient beings may raise.
  email: firat.akova@eaturkiye.org
  linkedin: ""
